name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke:
    name: Smoke test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check index.mjs

      - name: Smoke test (list MCP tools)
        run: node scripts/smoke.mjs
